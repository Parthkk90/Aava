# Static hosting for the Aava frontend. Any static host works; this file
# adds the security headers that cannot be set from a <meta> tag.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Note: add_header inside a location would drop the server-level headers above, so use expires.
  location = /release.json { expires -1; }

  # Anon-RPC harness bootstrap page: the only document the app itself may frame
  # (the harness then sandboxes it to an opaque origin). Every other path keeps
  # DENY / frame-ancestors 'none'. Headers are repeated because add_header in a
  # location replaces the server-level set.
  location ~ /anon-rpc-iframe\.html$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
