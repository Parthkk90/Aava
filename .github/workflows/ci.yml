name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.3.5 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: CROPS acceptance suite
        run: pnpm test:crops
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm demo

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: License inventory is up to date
        run: pnpm license-inventory && git diff --exit-code docs/third-party-licenses.json
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
